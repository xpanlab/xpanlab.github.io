  output-dir: docs
  render:
    - index.qmd
    - research.qmd
    - publications.qmd
    - join.qmd
  resources:
    - CNAME
    - images/
    - assets/

website:
  title: "Pan Lab"
  site-url: https://xpanlab.org
  description: "Computational pathology, artificial intelligence, and spatial omics at Pan Lab."
  search: false
  navbar:
    title: false
    background: dark
    foreground: "#ffffff"
    pinned: true
    collapse-below: md
    right:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: join.qmd
