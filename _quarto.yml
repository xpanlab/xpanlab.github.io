project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - research.qmd
    - publications.qmd
    - join.qmd
  resources:
    - CNAME
    - images/
    - assets/

website:
  title: "Pan Lab"
  site-url: https://xpanlab.org
  description: "Computational pathology, artificial intelligence, and spatial omics at Pan Lab."
  search: false
  navbar:
    title: |
      <span class="banner-lab-name">Pan Lab</span>
      <span class="banner-tagline">Computational Pathology · Artificial Intelligence · Spatial Omics · Cancer Research</span>
    background: dark
    foreground: "#ffffff"
    pinned: true
    collapse-below: md
    right:
      - href: index.qmd
        text: Home
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: join.qmd
        text: Join Us
  page-footer:
    border: false
    center: "© Xiaoxi Pan. Photos taken at Sam Rayburn Reservoir, TX, 2025."

format:
  html:
    theme: default
    css: styles.css
    toc: false
    anchor-sections: false
    title-block-banner: false
    include-after-body:
      - assets/banner-bottom.html
      - assets/banner-title.html
    lang: en
